name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      - uses: pre-commit/action@v3.0.1

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html 404.html styles.css script.js robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -r assets legal-notice privacy-policy _site/
          test -f _site/legal-notice/index.html
          test -f _site/privacy-policy/index.html
          test -f _site/assets/fonts/ibm-plex-sans-latin-400.woff2
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
