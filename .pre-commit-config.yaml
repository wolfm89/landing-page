# Local checks mirror the GitHub Actions `check` job.
# Run `pre-commit install` once, then `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: local
    hooks:
      - id: html-validate
        name: html-validate
        entry: npx --yes html-validate@9.7.1
        language: system
        types: [html]

      - id: site-check
        name: site-check
        entry: python3 scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
